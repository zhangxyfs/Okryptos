function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;

const REP = 9000;          // 斥力强度
const REP_CUT = 320;       // 斥力截断距离（跨簇不互斥）
const LEN = {struct: 110, ref: 170};  // 弹簧原长
const SPRING = 0.014;

const catSize = {};

const catsSorted = [...cats].sort((a,b)=>catSize[b]-catSize[a]);
const focus = {};
function layoutFoci(){
  const R = Math.min(W,H) * 0.40;
  const ring = catsSorted.filter(c => c !== "目录");
  focus["目录"] = { x: cx(), y: cy() }; // 目录节点居中
  ring.forEach((c,i) => {
    const ang = i / ring.length * 2 * Math.PI - Math.PI/2;
    focus[c] = { x: cx() + R*Math.cos(ang), y: cy() + R*Math.sin(ang)*0.8 };
  });
}
layoutFoci();

function tick() {
  alpha *= 0.996;
  const a = Math.max(alpha, 0.02);

  // 斥力 O(n^2)
  for (let i=0;i<nodes.length;i++) {
    const A = nodes[i];
    for (let j=i+1;j<nodes.length;j++) {
      const B = nodes[j];
      let dx = A.x-B.x, dy = A.y-B.y;
      let d2 = dx*dx+dy*dy; if (d2 < 1) { dx = rand()-0.5; dy = rand()-0.5; d2 = 1; }
      if (d2 > REP_CUT*REP_CUT) continue;
      const d = Math.sqrt(d2);
      const f = REP * a / d2;
      const fx = dx/d*f, fy = dy/d*f;
      A.vx += fx; A.vy += fy; B.vx -= fx; B.vy -= fy;
    }
  }
  // 弹簧
  edges.forEach(e => {
    const A = byId[e.source], B = byId[e.target];
    const dx = B.x-A.x, dy = B.y-A.y;
    const d = Math.max(Math.sqrt(dx*dx+dy*dy), 1);
    const f = (d - LEN[e.kind]) * SPRING * a;
    const fx = dx/d*f, fy = dy/d*f;
    A.vx += fx; A.vy += fy; B.vx -= fx; B.vy -= fy;
  });
  // 向心 + 类目焦点聚拢（定位力，不随 alpha 衰减）+ 积分
  nodes.forEach(n => {
    n.vx += (cx()-n.x) * GRAV;
    n.vy += (cy()-n.y) * GRAV;
    const f = focus[n.category];
    n.vx += (f.x-n.x) * CLUSTER;
    n.vy += (f.y-n.y) * CLUSTER;
    n.vx *= 0.82; n.vy *= 0.82;
    if (!n.pinned) {
      n.x += Math.max(-12, Math.min(12, n.vx));
      n.y += Math.max(-12, Math.min(12, n.vy));
    }
  });
  // 碰撞（半径不重叠）
  for (let i=0;i<nodes.length;i++) {
    const A = nodes[i];
    for (let j=i+1;j<nodes.length;j++) {
      const B = nodes[j];
      const dx = B.x-A.x, dy = B.y-A.y;
      const min = radius(A)+radius(B)+10;
      const d2 = dx*dx+dy*dy;
      if (d2 > 0 && d2 < min*min) {
        const d = Math.sqrt(d2), push = (min-d)/2/d;
        if (!A.pinned) { A.x -= dx*push; A.y -= dy*push; }
        if (!B.pinned) { B.x += dx*push; B.y += dy*push; }
      }
    }
  }
}

  if (dragNode) {
    moved = true;

    dragNode.x = p.x; dragNode.y = p.y;
  } else if (panning && panStart) {
    moved = true;
    view.x = panStart.vx + ev.clientX - panStart.x;
    view.y = panStart.vy + ev.clientY - panStart.y;
    applyView();
  }
  // tooltip
  const g = ev.target.closest(".node");
  if (g && !dragNode) {
    const n = nodes.find(n => nodeEls[n.id] === g);

  } else if (!dragNode) { hideTip(); hotEdges(null); }
});
svg.addEventListener("pointerup", ev => {
  if (dragNode) {
    const n = dragNode; dragNode = null; n.pinned = false;
    alpha = Math.max(alpha, 0.15); // 局部继续收敛
    if (!moved) selectNode(n);

svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k2 = Math.max(0.25, Math.min(4, view.k * (ev.deltaY < 0 ? 1.12 : 0.89)));
  view.x = mx - (mx - view.x) * k2 / view.k;
  view.y = my - (my - view.y) * k2 / view.k;

function hotEdges(n){
  const nb = {};
  if (n) {
    nb[n.id] = true;
    adj[n.id].forEach(e => { nb[e.source] = true; nb[e.target] = true; });
  }
  edges.forEach((e,i) => {

      !!n && (e.source === n.id || e.target === n.id));
  });
  // 悬停时淡化非邻居节点（含标签），突出连通关系
  nodes.forEach(nd => {
    const f = !!n && !nb[nd.id];
    nodeEls[nd.id].classList.toggle("fade", f);
    const t = labelEls[nd.id];
    if (t) t.classList.toggle("fade", f);
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ---------- 详情面板 ----------
const panel = document.getElementById("panel");
const panelBody = document.getElementById("panelBody");
document.getElementById("close").onclick = () => panel.classList.remove("open");
function selectNode(n){
  const out = edges.filter(e => e.source === n.id);
  const inc = edges.filter(e => e.target === n.id);
  const rel = [];
  out.forEach(e => rel.push({n: byId[e.target], k: "出·" + (e.kind==="struct"?"结构":"引用")}));
  inc.forEach(e => rel.push({n: byId[e.source], k: "入·" + (e.kind==="struct"?"结构":"引用")}));
  panelBody.innerHTML =
    `<h2>${esc(n.title)}</h2>` +
    `<div class="row"><span class="badge">${esc(n.type)}</span>` +
    `<span class="badge" style="background:${catColor[n.category]}22;color:${catColor[n.category]}">${esc(n.category)}</span></div>` +
    (n.tags.length ? `<div class="tags">${n.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>` : "") +
    (n.summary ? `<div class="summary">${esc(n.summary)}</div>` : "") +
    `<div class="row">出度 ${out.length} · 入度 ${inc.length} · 总连接 ${n.deg}</div>` +
    `<h3>关联条目（${rel.length}）</h3>` +
    rel.map((r,i) => `<div class="rel" data-id="${esc(r.n.id)}">${esc(r.n.title)}<span class="k">${r.k}</span></div>`).join("");
  panelBody.querySelectorAll(".rel").forEach(el =>
    el.onclick = () => selectNode(byId[el.dataset.id]));
  panel.classList.add("open");
}

// ---------- 图例 ----------
const legend = document.getElementById("legend");
const catState = {};
DATA.categories.forEach(c => {
  if (!nodes.some(n => n.category === c)) return;
  catState[c] = true;
  const d = document.createElement("div");
  d.className = "item"; d.dataset.cat = c;
  d.innerHTML = `<span class="dot" style="background:${catColor[c]}"></span>` +
    `<span>${esc(c)}（${nodes.filter(n=>n.category===c).length}）</span>`;
  d.onclick = () => {
    catState[c] = !catState[c];
    d.classList.toggle("off", !catState[c]);
    applyFilters();
  };
  legend.appendChild(d);
});
const hint = document.createElement("div");
hint.className = "hint"; hint.textContent = "点击图例高亮/淡化类目";
legend.appendChild(hint);

// ---------- 搜索 + 过滤 ----------
let query = "";
document.getElementById("search").addEventListener("input", ev => {
  query = ev.target.value.trim().toLowerCase();
  applyFilters();
});
function applyFilters(){
  const visible = {};
  nodes.forEach(n => {
    let v = catState[n.category] !== false;
    if (v && query) {
      v = n.title.toLowerCase().includes(query) ||
          n.tags.some(t => t.toLowerCase().includes(query)) ||
          (n.summary || "").toLowerCase().includes(query);
    }
    visible[n.id] = v;
    nodeEls[n.id].classList.toggle("dim", !v);
    const t = labelEls[n.id];
    if (t) t.classList.toggle("dim", !v);
  });
  edges.forEach((e,i) =>
    edgeEls[i].classList.toggle("dim", !(visible[e.source] && visible[e.target])));
}
</script>
