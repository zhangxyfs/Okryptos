# okserver 镜像发布：打 v* tag 时构建多架构镜像，GHCR + Docker Hub 双发
# （设计文档 2026-08-28-okdeploy-design.md §边界："发布镜像仓库拉取（GHCR + Docker
# Hub，随 release 双发）"）。NAS 侧 okdeploy 默认拉 Docker Hub 名
# openknowledge/okserver:<tag>；Docker Hub 限流或不可达时可把 .env 的
# OKSERVER_IMAGE 改为 GHCR 全名 ghcr.io/zhangxyfs/openknowledge/okserver:<tag>。
#
# 前置（一次性人工配置）：
#   1. GitHub 仓库 Settings → Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN
#      （Docker Hub Access Token，需对 openknowledge namespace 有写权限）。
#   2. 首次推送后到 GitHub Packages 把 openknowledge/okserver 包设为 Public，
#      否则 NAS 匿名拉取会被拒。
name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 手动单发：Actions → Docker → Run workflow，填镜像 tag
    inputs:
      tag:
        description: "镜像 tag（带 v 前缀，如 v2.22.3）"
        required: true

permissions:
  contents: read
  packages: write # GHCR 推送用 GITHUB_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 镜像 tag 与 okdeploy 的"镜像版本"输入保持同一格式：带 v 前缀（v2.22.3），
      # 同时发 latest。VERSION 构建参数同格式（与 NAS 本机构建命令一致）。
      # 手动触发时取 inputs.tag，tag 推送时取 github.ref_name。
      - name: 解析镜像 tag
        id: t
        run: |
          t="${{ github.event.inputs.tag || github.ref_name }}"
          t="${t//[[:space:]]/}"  # 输入框可能带进空格，Docker tag 不允许
          if [[ ! "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag 格式应为 vX.Y.Z，实得: '$t'" >&2; exit 1
          fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/nas/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.t.outputs.tag }}
          tags: |
            ghcr.io/zhangxyfs/openknowledge/okserver:${{ steps.t.outputs.tag }}
            ghcr.io/zhangxyfs/openknowledge/okserver:latest
            openknowledge/okserver:${{ steps.t.outputs.tag }}
            openknowledge/okserver:latest
