<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Okryptos 服务端部署</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect x='2' y='2' width='92' height='92' rx='20' fill='%23FFFFFF' stroke='%23E5E7EB' stroke-width='3'/%3E%3Cg transform='translate(-3.5,4.1) scale(0.92)'%3E%3Cpath d='M54 22 Q20 14 14 26 L14 70 Q20 82 54 74 Z' fill='%239CA3AF'/%3E%3Ccircle cx='34' cy='48' r='11' fill='none' stroke='%23FFFFFF' stroke-width='5'/%3E%3Cpath d='M58 22 Q92 14 98 26 L98 70 Q92 82 58 74 Z' fill='%234B5563'/%3E%3Cpath d='M72 34 V62 M72 50 L86 34 M76 46 L88 62' fill='none' stroke='%23FFFFFF' stroke-width='5' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<script>
// token 经 URL fragment 一次性注入（fragment 不发服务器、不进 Referer）；读入后转存
// sessionStorage 并从地址栏抹除——hash 路由会改写 location.hash，没有 sessionStorage
// 兜底的话，切页后再刷新 token 就丢了（同主 GUI web/index.html 的做法）。
(function () {
  var m = /[#&]token=([0-9a-f]+)/.exec(location.hash);
  if (m) {
    try { sessionStorage.setItem("okdeploy_token", m[1]); } catch (e) {}
    history.replaceState(null, "", location.pathname + location.search);
  }
  var t = "";
  try { t = sessionStorage.getItem("okdeploy_token") || ""; } catch (e) {}
  window.OK_TOKEN = t;
})();
</script>
</head>
<body>
<header class="topbar">
  <div class="sp"></div>
  <div class="lang-seg" id="lang-seg">
    <button data-lang="zh" class="on">中</button><button data-lang="en">EN</button>
  </div>
  <span id="conn-badge" class="badge off"><span class="dot" style="background:var(--gray)"></span>未连接</span>
</header>
<main id="app"></main>
<script src="/app.js"></script>
</body>
</html>
