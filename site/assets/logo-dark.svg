<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="580" height="120" role="img" aria-label="OpenKnowledge">
  <style>
    .flip{transform-box:fill-box;transform-origin:left center;animation:flip 3.2s ease-in-out infinite}
    @keyframes flip{0%,30%{transform:rotateY(0)}50%,60%{transform:rotateY(-52deg)}80%,100%{transform:rotateY(0)}}
  </style>
  <!-- 深色背景变体：双页改浅蓝，K 镂空改深色（右页每 3.2s 翻动一次；无 CSS 环境退化为静态） -->
  <g transform="translate(6,12)">
    <path d="M54 22 Q20 14 14 26 L14 70 Q20 82 54 74 Z" fill="#60a5fa"/>
    <circle cx="34" cy="48" r="11" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <g class="flip">
      <path d="M58 22 Q92 14 98 26 L98 70 Q92 82 58 74 Z" fill="#93c5fd"/>
      <path d="M72 34 V62 M72 50 L86 34 M76 46 L88 62" fill="none" stroke="#1F2937" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="140" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700"><tspan fill="#93c5fd">Open</tspan><tspan fill="#60a5fa">Knowledge</tspan></text>
</svg>
